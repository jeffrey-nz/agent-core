name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Syntax & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # --legacy-peer-deps: tree-sitter-go pins an older peer of tree-sitter
        # than tree-sitter-php/python/rust. The conflict is harmless at runtime
        # since these are optional peers.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Syntax-check all source files
        run: find src -name '*.js' | xargs -n1 node --check

      - name: Run tests
        run: npm test
